name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regintel
      DATABASE_URL_APP: postgresql://regintel_app:app@localhost:5432/regintel
      AUTH_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make setup

      - name: Create the non-superuser role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d regintel \
            -c "CREATE ROLE regintel_app LOGIN PASSWORD 'app';"

      - name: Test
        run: make test

      - name: Audit
        run: make audit
